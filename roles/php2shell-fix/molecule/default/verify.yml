---
- name: Verify latest upgrade
  hosts: all
  gather_facts: false
  tasks:
    - name: Read the installed PHP release
      ansible.builtin.command: php -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;'
      register: php_release
      changed_when: false

    - name: Latest upgrade installed a supported PHP
      ansible.builtin.assert:
        that:
          - php_release.rc == 0
          - php_release.stdout is version("8.2", ">=")
        fail_msg: "Expected PHP >= 8.2 from the distro archives, got '{{ php_release.stdout | default('') }}'."

    - name: Check whether the Ondrej repository was added
      ansible.builtin.stat:
        path: /etc/apt/sources.list.d/ondrej-php.sources
      register: ondrej_repo

    - name: Latest upgrade stays on the distro repositories
      ansible.builtin.assert:
        that:
          - not ondrej_repo.stat.exists

    - name: Look for a source build
      ansible.builtin.find:
        paths: /opt
        patterns: php-*-patched
        file_type: directory
      register: patched_builds

    - name: Latest upgrade does not compile PHP
      ansible.builtin.assert:
        that:
          - patched_builds.matched == 0
